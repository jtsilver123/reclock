name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine-tests-linux:
    name: Engine tests (Linux, Swift 6)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run ReclockKit tests
        working-directory: ReclockKit
        run: swift test --parallel

  ios-build-and-test:
    name: iOS build + tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Show destinations
        run: xcodebuild -showsdks | grep -i iphonesimulator
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Reclock.xcodeproj \
            -scheme Reclock \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES | xcbeautify --renderer github-actions || \
          xcodebuild build \
            -project Reclock.xcodeproj \
            -scheme Reclock \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
      - name: Unit tests (kit, on macOS toolchain)
        working-directory: ReclockKit
        run: swift test --parallel
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Reclock.xcodeproj \
            -scheme Reclock \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:ReclockUITests \
            CODE_SIGNING_ALLOWED=NO
