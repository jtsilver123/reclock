name: TestFlight

# Manual trigger: Actions → TestFlight → Run workflow.
# One-time setup (secrets/vars) is documented in SETUP.md → "TestFlight from CI".
#
# Signing strategy (proven in jtsilver123/cini): the team has no registered
# devices, so automatic signing can't make the development profile a normal
# archive wants, and a manual distribution identity conflicts with automatic
# signing. Instead: archive UNSIGNED, then let -exportArchive re-sign for the
# App Store with the cloud-managed distribution certificate via the API key.

on:
  workflow_dispatch:
    inputs:
      buildNumber:
        description: "Build number override (defaults to the run number)"
        required: false

jobs:
  upload:
    # macos-26 ships Xcode 26: App Store Connect rejects uploads built with an
    # older SDK (hard requirement since spring 2026 — run 3 failed exactly there).
    name: Archive & upload to TestFlight
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.RECLOCK_BUNDLE_ID != '' && vars.RECLOCK_BUNDLE_ID || 'app.reclock.ios' }}
      # Optional: flight-number lookup. Empty → the feature hides itself in the app.
      AERODATABOX_KEY: ${{ secrets.RECLOCK_AERODATABOX_KEY }}
      # Optional: Google sign-in (iOS OAuth client ID). Empty → Apple-only.
      GOOGLE_CLIENT_ID: ${{ secrets.RECLOCK_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v (see SETUP.md → TestFlight from CI)"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_API_KEY_P8 }}" ]; then
            echo "::error::Missing secret: ASC_API_KEY_P8 (contents of the .p8 key file)"; missing=1
          fi
          exit $missing

      - name: Install App Store Connect API key
        run: |
          # xcodebuild takes an explicit path; altool searches ~/.private_keys
          # and ~/.appstoreconnect/private_keys for AuthKey_<id>.p8.
          mkdir -p ~/.private_keys ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          BUILD_NUMBER='${{ github.event.inputs.buildNumber }}'
          BUILD_NUMBER="${BUILD_NUMBER:-${{ github.run_number }}}"
          echo "Building $BUNDLE_ID build #$BUILD_NUMBER"
          xcodebuild archive \
            -project Reclock.xcodeproj \
            -scheme Reclock \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Reclock.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            INFOPLIST_KEY_ReclockAeroDataBoxKey="$AERODATABOX_KEY" \
            INFOPLIST_KEY_ReclockGoogleClientID="$GOOGLE_CLIENT_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # The export re-sign derives entitlements from what the app already carries —
      # an unsigned archive carries none, and capabilities would silently vanish
      # (cini build 6 shipped without Sign in with Apple exactly this way). Ad-hoc
      # sign with our entitlements first so the distribution re-sign preserves them.
      - name: Stamp entitlements into the archive
        run: |
          APP="$RUNNER_TEMP/Reclock.xcarchive/Products/Applications/Reclock.app"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.dylib' -o -name '*.framework' \) \
              -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements Reclock.entitlements "$APP"
          echo "--- entitlements now in archive ---"
          codesign -d --entitlements :- "$APP"

      - name: Export IPA (re-signed for App Store)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Reclock.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates

      # Fail fast if the distribution re-sign dropped our entitlements — otherwise
      # time-sensitive delivery and HealthKit break on device and only a tester notices.
      - name: Verify entitlements survived export
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APP=$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' | head -1)
          codesign -d --entitlements :- "$APP" | tee "$RUNNER_TEMP/final-entitlements.plist"
          for key in "com.apple.developer.usernotifications.time-sensitive" "com.apple.developer.healthkit" "com.apple.developer.applesignin"; do
            grep -q "$key" "$RUNNER_TEMP/final-entitlements.plist" \
              || { echo "::error::$key missing from final IPA"; exit 1; }
          done

      - name: Upload to TestFlight
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded. Processing takes ~5–15 min in App Store Connect → TestFlight."
