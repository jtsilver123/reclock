name: TestFlight

# Manual trigger: Actions → TestFlight → Run workflow.
# One-time setup (secrets/vars) is documented in SETUP.md → "TestFlight from CI".

on:
  workflow_dispatch:
    inputs:
      buildNumber:
        description: "Build number override (defaults to the run number)"
        required: false

jobs:
  upload:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.RECLOCK_BUNDLE_ID != '' && vars.RECLOCK_BUNDLE_ID || 'app.reclock.ios' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v (see SETUP.md → TestFlight from CI)"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_API_KEY_P8 }}" ]; then
            echo "::error::Missing secret: ASC_API_KEY_P8 (contents of the .p8 key file)"; missing=1
          fi
          exit $missing

      - name: Install App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Archive signs with the DISTRIBUTION identity directly: development profiles
      # need a registered device, and a fresh team on a headless runner has none.
      - name: Archive
        run: |
          set -o pipefail
          BUILD_NUMBER='${{ github.event.inputs.buildNumber }}'
          BUILD_NUMBER="${BUILD_NUMBER:-${{ github.run_number }}}"
          echo "Building $BUNDLE_ID build #$BUILD_NUMBER"
          xcodebuild archive \
            -project Reclock.xcodeproj \
            -scheme Reclock \
            -destination 'generic/platform=iOS' \
            -archivePath build/Reclock.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export & upload to TestFlight
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Reclock.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded. Processing takes ~5–15 min in App Store Connect → TestFlight."
