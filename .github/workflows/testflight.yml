name: TestFlight

# Manual trigger: Actions → TestFlight → Run workflow.
# One-time setup (secrets/vars) is documented in SETUP.md → "TestFlight from CI".
#
# Signing strategy (proven in jtsilver123/cini): the team has no registered
# devices, so automatic signing can't make the development profile a normal
# archive wants, and a manual distribution identity conflicts with automatic
# signing. Instead: archive UNSIGNED, then let -exportArchive re-sign for the
# App Store with the cloud-managed distribution certificate via the API key.

on:
  workflow_dispatch:
    inputs:
      buildNumber:
        description: "Build number override (defaults to the run number)"
        required: false

jobs:
  upload:
    # macos-26 ships Xcode 26: App Store Connect rejects uploads built with an
    # older SDK (hard requirement since spring 2026 — run 3 failed exactly there).
    name: Archive & upload to TestFlight
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.RECLOCK_BUNDLE_ID != '' && vars.RECLOCK_BUNDLE_ID || 'app.reclock.ios' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v (see SETUP.md → TestFlight from CI)"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_API_KEY_P8 }}" ]; then
            echo "::error::Missing secret: ASC_API_KEY_P8 (contents of the .p8 key file)"; missing=1
          fi
          exit $missing

      - name: Install App Store Connect API key
        run: |
          # xcodebuild takes an explicit path; altool searches ~/.private_keys
          # and ~/.appstoreconnect/private_keys for AuthKey_<id>.p8.
          mkdir -p ~/.private_keys ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          BUILD_NUMBER='${{ github.event.inputs.buildNumber }}'
          BUILD_NUMBER="${BUILD_NUMBER:-${{ github.run_number }}}"
          echo "Building $BUNDLE_ID build #$BUILD_NUMBER"
          xcodebuild archive \
            -project Reclock.xcodeproj \
            -scheme Reclock \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Reclock.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # Reclock declares no entitlements (local notifications only — no push, no
      # HealthKit capability in v1), so unlike Cini there is nothing to stamp into
      # the archive before the export re-sign builds its entitlements.

      - name: Export IPA (re-signed for App Store)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Reclock.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded. Processing takes ~5–15 min in App Store Connect → TestFlight."
